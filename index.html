<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="다육이 소원">
<meta name="theme-color" content="#e7f4ec">
<title>다육이 소원 공작소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen tablet app. A single stage card swaps between start → 4 picture questions → magic search → result; staff drawer slides in from the right. */
:root{
  --bg:#e7f4ec; --bg2:#d3ecdf; --card:#ffffff; --ink:#1f3d2f; --ink-soft:#557466;
  --leaf:#3f9a67; --leaf-deep:#2b7a4f; --pink:#ff7a9c; --sun:#ffd25c; --sky:#8fd3f0;
  --line:#c5e2d2; --chip:#f2faf5; --danger:#d9534f;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13241c; --bg2:#1a3227; --card:#1e3a2d; --ink:#eaf7ef; --ink-soft:#a9c9b8;
  --leaf:#6cc890; --leaf-deep:#8fe0ad; --pink:#ff8fac; --sun:#ffd96f; --sky:#7cc6e6;
  --line:#2f5442; --chip:#244536; --danger:#ff7b76; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13241c; --bg2:#1a3227; --card:#1e3a2d; --ink:#eaf7ef; --ink-soft:#a9c9b8;
  --leaf:#6cc890; --leaf-deep:#8fe0ad; --pink:#ff8fac; --sun:#ffd96f; --sky:#7cc6e6;
  --line:#2f5442; --chip:#244536; --danger:#ff7b76; color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;
  background-image:radial-gradient(circle at 12% 18%,var(--bg2) 0 90px,transparent 91px),
  radial-gradient(circle at 88% 82%,var(--bg2) 0 130px,transparent 131px);
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:16px;box-sizing:border-box;gap:14px}
header{width:100%;max-width:980px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:clamp(20px,3.4vw,28px);color:var(--leaf-deep);display:flex;align-items:center;gap:8px}
.brand small{font-family:var(--body);font-size:14px;color:var(--ink-soft)}
.iconbtn{border:2px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:14px;
  font:inherit;font-size:14px;padding:8px 12px;cursor:pointer}
.iconbtn:focus-visible,.choice:focus-visible,.big:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

.stage{width:100%;max-width:980px;background:var(--card);border-radius:36px;border:3px solid var(--line);
  box-shadow:0 10px 0 var(--line);padding:clamp(18px,4vw,40px);box-sizing:border-box;position:relative;flex:1;
  display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;flex:1;animation:pop .45s ease}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:clamp(34px,6.4vw,62px);color:var(--leaf-deep)}
h1 em{font-style:normal;color:var(--pink)}
h2{font-size:clamp(28px,5vw,46px)}
.lead{font-size:clamp(18px,2.6vw,24px);color:var(--ink-soft);margin:0;max-width:30ch;line-height:1.5;word-break:keep-all}

.big{touch-action:manipulation;font-family:var(--display);font-size:clamp(26px,4vw,36px);border:none;border-radius:999px;
  padding:18px 46px;background:var(--pink);color:#fff;cursor:pointer;box-shadow:0 7px 0 #d9547a;
  transition:transform .1s}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #d9547a}
.big.green{background:var(--leaf);box-shadow:0 7px 0 var(--leaf-deep)}
.big:disabled{opacity:.45;cursor:not-allowed}

/* shelf of 5 friends on start screen */
.shelf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:100%;max-width:820px}
.friend{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.friend svg{width:100%;max-width:130px;height:auto}
.friend b{font-family:var(--display);font-weight:400;font-size:clamp(14px,2.2vw,20px)}
.left{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums;background:var(--chip);
  border-radius:999px;padding:2px 10px}
.left.out{color:var(--danger)}
.friend.gone svg{filter:grayscale(1);opacity:.4}
.bob{animation:bob 2.6s ease-in-out infinite}
.friend:nth-child(2) .bob{animation-delay:.3s}.friend:nth-child(3) .bob{animation-delay:.6s}
.friend:nth-child(4) .bob{animation-delay:.9s}.friend:nth-child(5) .bob{animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-6px)}}

/* progress sprouts */
.sprouts{display:flex;gap:14px;justify-content:center}
.sprout{width:34px;height:34px;border-radius:50%;background:var(--chip);border:3px solid var(--line);
  display:grid;place-items:center;font-size:18px;transition:.3s}
.sprout.done{background:var(--leaf);border-color:var(--leaf-deep)}
.sprout.now{border-color:var(--pink);transform:scale(1.15)}
.qnum{font-family:var(--display);color:var(--pink);font-size:20px}

.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;width:100%;max-width:900px}
.choice{touch-action:manipulation;user-select:none;-webkit-user-select:none;border:3px solid var(--line);background:var(--chip);border-radius:24px;padding:clamp(12px,2.6vmin,26px) 4px clamp(10px,2.2vmin,22px);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;color:var(--ink);min-width:0;
  transition:transform .12s,border-color .12s}
.choice:hover{transform:translateY(-4px);border-color:var(--leaf)}
.choice.picked{border-color:var(--pink);background:var(--card);transform:scale(1.06)}
.choice .pic{font-size:clamp(38px,8vmin,80px);line-height:1}
.choice .sw{width:clamp(50px,10vmin,96px);aspect-ratio:1;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px var(--line);max-width:100%;display:grid;place-items:center}
.choice .sw b{font-size:clamp(24px,5vmin,46px);line-height:1}
.choice span{font-family:var(--display);font-size:clamp(16px,3vmin,26px);word-break:keep-all;line-height:1.2}

/* magic */
.magic svg{width:min(240px,60vw);height:auto}
.spin{animation:wiggle .5s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.dots span{display:inline-block;animation:bob 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}

/* result */
.result{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;align-items:center;width:100%;text-align:left}
.result .hero{display:flex;flex-direction:column;align-items:center;gap:6px}
.result .hero svg{width:min(300px,70vw);height:auto}
.tag{font-family:var(--display);background:var(--sun);color:#5a3d00;border-radius:999px;padding:8px 26px;font-size:clamp(24px,3.6vw,34px);text-align:center;word-break:keep-all}
.r-title{font-size:clamp(20px,3vw,26px);color:var(--ink-soft);font-family:var(--display)}
.r-name{font-size:clamp(38px,6vw,60px);color:var(--leaf-deep)}
.r-real{font-size:16px;color:var(--ink-soft)}
.why{background:var(--chip);border-radius:20px;padding:14px 18px;font-size:clamp(17px,2.3vw,21px);line-height:1.55;margin:0}
.care{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.care div{word-break:keep-all;border:2px dashed var(--line);border-radius:18px;padding:10px 6px;text-align:center;font-size:15px;line-height:1.35;min-width:0}
.care b{display:block;font-size:30px;margin-bottom:2px}
.wish{font-family:var(--display);font-size:clamp(20px,2.8vw,26px);color:var(--pink);margin:0}
.actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%}
.staffnote{font-size:15px;color:var(--ink-soft);background:var(--chip);border-radius:12px;padding:6px 12px;font-variant-numeric:tabular-nums}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* staff drawer */
.drawer{position:fixed;inset:0;background:rgb(0 0 0 / .35);display:flex;justify-content:flex-end;z-index:10}
.panel{background:var(--card);color:var(--ink);width:min(420px,100%);height:100%;overflow:auto;padding:22px 20px;box-sizing:border-box;
  display:flex;flex-direction:column;gap:14px;border-left:3px solid var(--line)}
.panel h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.panel table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.panel td,.panel th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:16px}
.panel th{font-size:13px;color:var(--ink-soft);font-weight:400;letter-spacing:.04em}
.panel td.n{text-align:right}
.bar{height:8px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--leaf)}
.pbtn{font:inherit;font-size:16px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.pbtn.warn{border-color:var(--danger);color:var(--danger)}
.pbtn:disabled{opacity:.4}
.sync{font-size:14px;color:var(--ink-soft);line-height:1.5}
.adj{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.adj h4{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.adjrow{display:flex;align-items:center;gap:8px}
.adjname{flex:1;min-width:0;font-size:16px}
.pbtn.sm{padding:8px 12px;font-size:15px}
.pbtn.step{width:46px;height:46px;padding:0;font-size:24px;line-height:1;border-radius:50%}
.adjnum{min-width:58px;height:46px;font:inherit;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;border:2px dashed var(--leaf);
  border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer}
.adjrow input{width:76px;height:42px;font:inherit;font-size:20px;text-align:center;border:2px solid var(--leaf);border-radius:12px;background:var(--card);color:var(--ink)}
.pbtn:focus-visible,.adjnum:focus-visible,.adjrow input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.pindots{display:flex;gap:12px;justify-content:center;padding-block:6px}
.pindots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--leaf);box-sizing:border-box}
.pindots i.on{background:var(--leaf)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pinpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:300px;width:100%;margin-inline:auto}
.pinkey{height:64px;font-size:26px;font-weight:700}
.pbtn.onbtn{background:var(--leaf);border-color:var(--leaf-deep);color:#fff}
.sheetlink{color:var(--leaf-deep);font-weight:700;font-size:15px}
.gate{position:fixed;inset:0;background:rgb(0 0 0 / .4);display:grid;place-items:center;z-index:12;padding:16px}
.gatebox{word-break:keep-all;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:28px;padding:20px;width:min(360px,100%);
  display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.gatehead{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:24px}
.gatehead b{font-weight:400}
.demotag{font-family:var(--body);font-size:13px;background:var(--sun);color:#5a3d00;border-radius:999px;padding:2px 10px}
.storypic{width:min(100%,760px,calc(40vh * 400 / 240));aspect-ratio:400/240;background:linear-gradient(var(--sky),var(--bg) 70%);border-radius:28px;
  border:3px solid var(--line);overflow:hidden;cursor:pointer;animation:pop .5s ease}
.storypic > svg{width:100%;height:100%;display:block}
.storycap{font-family:var(--display);font-size:clamp(20px,min(3vw,3.6vh),30px);line-height:1.35;margin:0;max-width:30ch;text-wrap:balance;word-break:keep-all;color:var(--ink)}
.storydots{display:flex;gap:8px}
.storydots i{width:34px;height:8px;border-radius:9px;background:var(--line);overflow:hidden;display:block}
.storydots i.done{background:var(--leaf)}
.storydots i b{display:block;height:100%;width:100%;background:var(--pink);transform-origin:left;animation:fillbar linear forwards}
@keyframes fillbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sheetlink{color:var(--leaf-deep);font-weight:700;font-size:15px}
.confirm{border:2px solid var(--danger);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm .row{display:flex;gap:8px}.confirm .row button{flex:1}

@media (orientation:portrait) and (min-width:641px){
  .choices{gap:16px}
  .choice{min-height:19vh;justify-content:center;gap:14px}
  .choice .pic{font-size:clamp(48px,10vw,96px)}
  .choice .sw{width:clamp(70px,13vw,120px)}
  .choice .sw b{font-size:clamp(32px,6vw,56px)}
  .choice span{font-size:clamp(20px,3.6vw,30px)}
}
@media (max-width:640px){
  .choices{grid-template-columns:repeat(3,minmax(0,1fr))}
  .result{grid-template-columns:1fr;text-align:center}
}
@media (max-width:440px){.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.shelf{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body style="margin:0">


<div class="wrap">
  <header>
    <div class="brand">🌱 다육이 소원 공작소 <small>Justwalk · 네임스티커</small><span class="demotag" id="modeTag" hidden>이 기기만</span></div>
    <div style="display:flex;gap:8px">
      <button class="iconbtn" id="soundBtn" type="button" aria-pressed="true">소리 켜짐</button>
      <button class="iconbtn" id="staffBtn" type="button">선생님 메뉴</button>
    </div>
  </header>
  <main class="stage" id="stage"></main>
</div>
<div class="confetti" id="confetti"></div>
<div class="drawer" id="drawer" hidden></div>
<div class="gate" id="gate" hidden></div>

<script>
const TOTAL = 40;
const KINDS = {
  star:  {name:"반짝 보석이", real:"수", basket:1, color:"#a8dcef",
          trait:"상상하고 꿈꾸기를 좋아하는", wish:"멋진 꿈이 반짝 이루어지게 해 줄게!",
          care:[["💧","흙이 바싹 마르면 조금"],["🌤️","센 햇빛보다 밝은 그늘"],["💎","잎에 작은 창문이 있어요"]]},
  bean:  {name:"새콤 사과사탕", real:"애플캔디", basket:2, color:"#ffc2b0",
          trait:"친구랑 놀면 신나는", wish:"친구랑 웃음이 가득하게 해 줄게!",
          care:[["💧","흙이 바싹 마르면 물 주기"],["☀️","햇빛 받으면 볼이 빨개져요"],["🍎","사탕처럼 동글동글한 잎"]]},
  rose:  {name:"장미 요정", real:"어메이징그레이스", basket:3, color:"#f7b8cc",
          trait:"마음씨가 곱고 꾸미기를 좋아하는", wish:"예쁜 마음이 쑥쑥 자라게 해 줄게!",
          care:[["💧","흙이 바싹 마르면 물 주기"],["☀️","햇빛을 아주 좋아해요"],["🌸","하얀 가루는 닦지 말아요"]]},
  brave: {name:"뾰족 용감이", real:"엘린", basket:4, color:"#ffe08a",
          trait:"씩씩하고 용감한", wish:"용기가 필요할 때 힘을 줄게!",
          care:[["💧","흙이 바싹 마르면 물 주기"],["☀️","햇빛을 아주 좋아해요"],["👑","빨간 뾰족 끝이 왕관 같아요"]]},
  bunny: {name:"동글 나무", real:"미니염좌", basket:5, color:"#bfe6a6",
          trait:"포근하고 다정한", wish:"가족이랑 따뜻하게 지내게 해 줄게!",
          care:[["💧","흙이 바싹 마르면 물 주기"],["☀️","밝은 창가가 좋아요"],["🌳","작은 나무처럼 자라요"]]},
};
const ORDER = ["star","bean","rose","brave","bunny"];

const QUESTIONS = [
  {q:"어떤 색깔이 제일 좋아?", opts:[
    {t:"초록", sw:"#3f8f55", p:"🍀", s:{star:2}},   {t:"하늘색", sw:"#8fd3f0", p:"🌊", s:{star:2}},
    {t:"빨강", sw:"#ff5f5f", p:"🍓", s:{bean:2}},   {t:"주황", sw:"#ff9f4a", p:"🍊", s:{bean:2}},
    {t:"분홍", sw:"#f6a9b8", p:"🌸", s:{rose:2}},   {t:"보라", sw:"#b79cf0", p:"🍇", s:{rose:2}},
    {t:"노랑", sw:"#f6dc4c", p:"🌻", s:{brave:2}},  {t:"금색", sw:"#e2b33c", p:"👑", s:{brave:2}},
    {t:"연두", sw:"#b8dc5c", p:"🌱", s:{bunny:2}},  {t:"갈색", sw:"#a87a52", p:"🌰", s:{bunny:2}} ]},
  {q:"어떤 동물 친구가 좋아?", opts:[
    {t:"돌고래", p:"🐬", s:{star:2}},  {t:"거북이", p:"🐢", s:{star:2}},
    {t:"강아지", p:"🐶", s:{bean:2}},  {t:"원숭이", p:"🐵", s:{bean:2}},
    {t:"고양이", p:"🐱", s:{rose:2}},  {t:"다람쥐", p:"🐿️", s:{rose:2}},
    {t:"사자", p:"🦁", s:{brave:2}},   {t:"공룡", p:"🦖", s:{brave:2}},
    {t:"토끼", p:"🐰", s:{bunny:2}},   {t:"판다", p:"🐼", s:{bunny:2}} ]},
  {q:"뭐 하고 놀 때 제일 신나?", opts:[
    {t:"별 구경", p:"🔭", s:{star:2}},      {t:"책 읽기", p:"📚", s:{star:2}},
    {t:"친구랑 놀기", p:"🤸", s:{bean:2}},  {t:"노래 부르기", p:"🎤", s:{bean:2}},
    {t:"그림 그리기", p:"🖍️", s:{rose:2}},  {t:"춤추기", p:"💃", s:{rose:2}},
    {t:"공놀이", p:"⚽", s:{brave:2}},      {t:"보물 찾기", p:"🗺️", s:{brave:2}},
    {t:"꼭 안기", p:"🤗", s:{bunny:2}},     {t:"요리 놀이", p:"🍳", s:{bunny:2}} ]},
  {q:"어떤 소원을 빌고 싶어?", opts:[
    {t:"멋진 꿈", p:"🌟", s:{star:3}},       {t:"우주 여행", p:"🚀", s:{star:3}},
    {t:"친구 많이", p:"🎈", s:{bean:3}},     {t:"매일 웃기", p:"😄", s:{bean:3}},
    {t:"고운 마음", p:"💗", s:{rose:3}},     {t:"꽃처럼 활짝", p:"🌷", s:{rose:3}},
    {t:"용기", p:"🦸", s:{brave:3}},         {t:"튼튼한 몸", p:"💪", s:{brave:3}},
    {t:"행복한 가족", p:"🏡", s:{bunny:3}},  {t:"가족 여행", p:"🚗", s:{bunny:3}} ]},
];

/* ---------- plant drawings ---------- */
function pot(fill){
  return `<path d="M52 128h96l-10 60h-76z" fill="${fill}"/><rect x="44" y="118" width="112" height="16" rx="8" fill="${fill}" stroke="rgba(0,0,0,.09)" stroke-width="2"/>
  <circle cx="84" cy="156" r="5" fill="#3a2a2a"/><circle cx="116" cy="156" r="5" fill="#3a2a2a"/>
  <circle cx="86" cy="154" r="1.6" fill="#fff"/><circle cx="118" cy="154" r="1.6" fill="#fff"/>
  <path d="M92 166q8 8 16 0" stroke="#3a2a2a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="72" cy="166" rx="7" ry="4" fill="#ff7a9c" opacity=".5"/><ellipse cx="128" cy="166" rx="7" ry="4" fill="#ff7a9c" opacity=".5"/>`;
}
let GID=0;
function leafPath(L,W,tip){
  return tip==="point"
    ? `M100 100C${100-W} ${100-L*.42} ${100-W*.55} ${100-L*.86} 100 ${100-L}C${100+W*.55} ${100-L*.86} ${100+W} ${100-L*.42} 100 100Z`
    : `M100 100C${100-W} ${100-L*.3} ${100-W*.95} ${100-L} 100 ${100-L}C${100+W*.95} ${100-L} ${100+W} ${100-L*.3} 100 100Z`;
}
/* rings: outer → inner. each {L,W,n,base,tip,edge,stroke,sw,shape,spike,dots,off} */
function rosette(rings,squash,cy){
  let defs="",s="";
  rings.forEach((r,ri)=>{
    const id="g"+(++GID);
    defs+=`<linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${r.base}"/><stop offset=".55" stop-color="${r.base}"/><stop offset="1" stop-color="${r.edge}"/></linearGradient>`;
    for(let i=0;i<r.n;i++){
      const a=i*360/r.n+(r.off??ri*(180/r.n));
      s+=`<g transform="rotate(${a} 100 100)"><path d="${leafPath(r.L,r.W,r.shape)}" fill="url(#${id})" stroke="${r.stroke}" stroke-width="${r.sw}" stroke-linejoin="round"/>`;
      if(r.spike) s+=`<path d="M98 ${102-r.L} L100 ${96-r.L} L102 ${102-r.L}Z" fill="${r.spike}"/>`;
      if(r.dots) s+=`<circle cx="96" cy="${100-r.L*.6}" r="1.3" fill="#9a5b4a" opacity=".55"/><circle cx="104" cy="${100-r.L*.72}" r="1.1" fill="#9a5b4a" opacity=".55"/>`;
      if(r.window) s+=`<path d="${leafPath(r.L*.55,r.W*.55,"point")}" transform="translate(0 ${-r.L*.42})" fill="#b6efc4" opacity=".75"/>
        <path d="M100 ${100-r.L*.5}V${100-r.L*.9}M96 ${100-r.L*.55}L99 ${100-r.L*.82}M104 ${100-r.L*.55}L101 ${100-r.L*.82}" stroke="#e9fff0" stroke-width="1.4" stroke-linecap="round" opacity=".9"/>`;
      s+=`</g>`;
    }
  });
  return `<defs>${defs}</defs><g transform="translate(100 120) scale(1.32) translate(-100 -120)"><g transform="translate(0 ${cy-100*squash}) scale(1 ${squash})">${s}</g></g>`;
}

      [[0,-1],[1,0],[0,1],[-1,0]].forEach(([dx,dy],i)=>{const a=i*90+45;
        s+=`<ellipse cx="0" cy="-14" rx="10" ry="15" fill="url(#${id})" stroke="#ec7b4f" stroke-width="2.4" transform="rotate(${a})"/>`;});

/* =====================================================================
   ★ 설정 — 구글 시트 Apps Script를 배포한 뒤 여기만 고쳐 주세요 ★
   SCRIPT_URL : Apps Script 웹 앱 주소 (https://script.google.com/macros/s/…/exec)
                비워 두면 시트 없이 "이 기기 안에서만" 세는 체험 모드로 동작해요.
   APP_KEY    : Code.gs 맨 위의 APP_KEY와 똑같이
   SHEET_URL  : (선택) 구글 시트 주소. 선생님 메뉴에 '시트 열기' 링크가 생겨요.
   ===================================================================== */
const CONFIG = {
  SCRIPT_URL: "",
  APP_KEY: "dayuk-2026",
  SHEET_URL: "https://docs.google.com/spreadsheets/d/1YWLHve102VGwq-bHA8ejAs8xRBYg8sd8d_VN-lWTuLs/edit"
};

/* ---------- stock store: one Google Sheet shared by every pad (via Apps Script) ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const REQUIRE_SHARED=!!CONFIG.SCRIPT_URL;
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const Store = {
  round:1, picks:[], local:!CONFIG.SCRIPT_URL, status:CONFIG.SCRIPT_URL?"connecting":"local",
  myLast:[], listeners:[], pending:null, timer:null, lastSync:null,
  counts(){const c={};ORDER.forEach(k=>c[k]=0);this.picks.forEach(p=>{if(c[p.kind]!=null&&!p.add)c[p.kind]++});return c;},
  supply(k){return TOTAL+this.picks.reduce((a,p)=>a+(p.kind===k&&p.add?p.add:0),0);},
  rawLeft(k){return this.supply(k)-this.counts()[k];},
  left(k){return Math.max(0,this.rawLeft(k));},
  emit(){this.listeners.forEach(f=>f());},
  loadLocal(){try{const d=JSON.parse(localStorage.getItem("dayuk-local")||"{}");this.picks=d.picks||[];}catch(e){this.picks=[];}},
  saveLocal(){try{localStorage.setItem("dayuk-local",JSON.stringify({picks:this.picks}));}catch(e){}},

  /* One call to the sheet script. Plain-text POST avoids the browser's extra CORS check. */
  async api(action,data={}){
    const ctrl=new AbortController(), to=setTimeout(()=>ctrl.abort(),30000);
    try{
      const r=await fetch(CONFIG.SCRIPT_URL,{method:"POST",redirect:"follow",signal:ctrl.signal,
        headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,key:CONFIG.APP_KEY,...data})});
      if(!r.ok) throw {code:"http",message:"HTTP "+r.status};
      let j; try{ j=await r.json(); }catch(e){ throw {code:"not_json",message:"시트 스크립트 응답을 읽지 못했어요"}; }
      if(j.error) throw {code:j.error,message:j.message||j.error};
      return j;
    } finally { clearTimeout(to); }
  },
  apply(s){ if(!s) return; this.round=s.round; this.picks=s.picks||[]; this.lastSync=Date.now(); this.status="shared"; this.emit(); },
  errText(e){
    switch(e&&e.code){
      case "bad_key": return "APP_KEY가 Code.gs와 달라요. 두 곳을 똑같이 맞춰 주세요.";
      case "busy": return "여러 패드가 한꺼번에 눌러서 잠깐 밀렸어요. 다시 눌러 주세요.";
      case "not_json": return "시트 스크립트 주소(SCRIPT_URL)나 배포 설정(액세스: 모든 사용자)을 확인해 주세요.";
      default: return "구글 시트에 연결하지 못했어요. 인터넷을 확인해 주세요.";
    }
  },
  async refresh(){
    try{ const j=await this.api("state"); this.lastErr=null; this.apply(j.state); }
    catch(e){ this.lastErr=this.errText(e); if(this.status!=="shared"){ this.status="offline"; } this.emit(); }
  },
  async init(){
    if(this.local){ this.loadLocal(); this.emit(); return; }
    await this.refresh();
    this.timer=setInterval(()=>{ if(document.visibilityState==="visible") this.refresh(); },15000);
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") this.refresh(); });
  },
  async write(action,data,failMsg){
    try{ const j=await this.api(action,data); this.apply(j.state); return j; }
    catch(e){ toastSync(failMsg+" ("+this.errText(e)+")"); this.refresh(); return null; }
  },
  async adjust(k,delta){
    if(!delta) return;
    if(this.local){ this.picks.push({id:newId("a"),kind:k,add:delta,at:Date.now()}); this.saveLocal(); this.emit(); return; }
    await this.write("adjust",{kind:k,delta},"개수 조정이 저장되지 않았어요.");
  },
  async setLeft(k,v){
    if(this.local){ return this.adjust(k,v-this.rawLeft(k)); }
    await this.write("setLeft",{kind:k,value:v},"개수 맞추기가 저장되지 않았어요.");
  },
  /* Hand out one pot. The sheet script counts again under a lock and only gives a kind that is
     really left, so two pads can never take the same last pot. Retrying the same request is safe. */
  async claim(order){
    if(this.local){
      for(const k of order){ if(this.left(k)>0){ const id=newId("l"); this.picks.push({id,kind:k,at:Date.now()}); this.saveLocal(); this.myLast.push(id); this.emit(); return {kind:k}; } }
      return {kind:null};
    }
    const reqId=this.pending||newId("r"); this.pending=reqId;
    let j; try{ j=await this.api("claim",{order,reqId}); }catch(e){ return {error:"net"}; }
    this.pending=null;
    if(j.kind && j.id) this.myLast.push(j.id);
    this.apply(j.state);
    return {kind:j.kind||null};
  },
  async undo(){
    const id=this.myLast.pop(); if(!id) return;
    if(this.local){ this.picks=this.picks.filter(p=>p.id!==id); this.saveLocal(); this.emit(); return; }
    await this.write("undo",{id},"취소가 저장되지 않았어요.");
  },
  async reset(){
    this.myLast=[];
    if(this.local){ this.picks=[]; this.saveLocal(); this.emit(); return; }
    await this.write("reset",{},"초기화가 안 됐어요. 다시 눌러 주세요.");
  }
};

let soundOn=true, actx=null;
function beep(f=660,d=.09){ if(!soundOn) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain(); o.type="sine"; o.frequency.value=f;
  g.gain.setValueAtTime(.18,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+d);}catch(e){} }

function decide(){
  const score={}; ORDER.forEach(k=>score[k]=0);
  state.answers.forEach((ai,qi)=>{const s=QUESTIONS[qi].opts[ai].s;for(const k in s) score[k]+=s[k];});
  // keep the 200 pots balanced: a small bonus for kinds with more left breaks near-ties
  return ORDER
    .map(k=>({k, out:Store.left(k)<=0, v:score[k] + 1.5*Store.left(k)/Math.max(1,Store.supply(k)) + Math.random()*.01}))
    .sort((a,b)=>(a.out-b.out)||(b.v-a.v))
    .map(c=>c.k);
}

const START_PIN="568"; let gpin="", gerr=false;

function gatePress(d){
  gerr=false;

    if(gpin===START_PIN){ closeGate(); beep(880); state={screen:"start",qi:0,answers:[]}; render(); return; }

      :`<button class="pbtn warn" id="reset" type="button">재고 초기화 (행사 시작 전)</button>`}
    <div class="adj"><h4>구글 시트 연결</h4>
      <p class="sync" style="margin:0">${Store.local
        ? "<b style='color:var(--danger)'>시트 주소(SCRIPT_URL)가 비어 있어서, 이 기기 안에서만 세고 있어요.</b> 여러 패드가 같은 재고를 쓰려면 index.html의 CONFIG에 주소를 넣어 주세요."
        : Store.status==="shared"
          ? `모든 패드가 구글 시트 하나로 재고를 함께 써요. 15초마다 새로 불러와요.${Store.lastSync?`<br>마지막으로 불러온 시각: ${new Date(Store.lastSync).toLocaleTimeString("ko-KR")}`:""}`
          : Store.status==="connecting" ? "구글 시트에 연결하는 중이에요." : `<b style='color:var(--danger)'>${Store.lastErr||"구글 시트에 연결하지 못했어요."}</b>`}</p>
      <div class="adjrow">${Store.local?"":`<button class="pbtn sm" id="refreshNow" type="button">지금 새로 불러오기</button>`}
        ${CONFIG.SHEET_URL?`<a class="sheetlink" href="${CONFIG.SHEET_URL}" target="_blank" rel="noopener">구글 시트 열기 ↗</a>`:""}</div></div>
    <p class="sync">${Store.status==="connecting" ? "재고를 불러오는 중이에요." : Store.local
      ? "이 기기 안에서만 개수를 세고 있어요."
      : "로그인한 모든 기기가 같은 재고를 함께 써요. 다른 태블릿에서 추천해도 바로 줄어들어요."}
      ${syncMsg?`<br><b style="color:var(--danger)">${syncMsg}</b>`:""}</p>
  </div>`;
  drawer.querySelector("#close").onclick=closeDrawer;
  bindSync();
  const rn=drawer.querySelector("#refreshNow"); if(rn) rn.onclick=async()=>{ rn.disabled=true; rn.textContent="불러오는 중…"; await Store.refresh(); renderDrawer(); };
  drawer.querySelector("#storyToggle").onclick=()=>{ storyOn=!storyOn; try{localStorage.setItem("dayuk-story",storyOn?"on":"off");}catch(e){} renderDrawer(); };
  drawer.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{const k=b.dataset.k,d=+b.dataset.d;
    if(d<0&&Store.left(k)<=0) return; await Store.adjust(k,d); renderDrawer();});
  drawer.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{editing=b.dataset.edit;draft=String(Store.left(editing));renderDrawer();
    const i=drawer.querySelector("#adjInput"); if(i){i.focus();i.select();}});
  const inp=drawer.querySelector("#adjInput");
  if(inp){ inp.oninput=()=>{draft=inp.value;}; inp.onkeydown=e=>{if(e.key==="Enter") drawer.querySelector("[data-apply]").click(); if(e.key==="Escape"){editing=null;renderDrawer();}}; }
  const ap=drawer.querySelector("[data-apply]");
  if(ap) ap.onclick=async()=>{const k=ap.dataset.apply, v=parseInt(draft,10);
    if(isNaN(v)||v<0){ toastSync("0 이상의 숫자를 넣어 주세요."); return; }
    syncMsg=""; editing=null; await Store.setLeft(k, v); renderDrawer();};
  const cn=drawer.querySelector("[data-cancel]"); if(cn) cn.onclick=()=>{editing=null;renderDrawer();};
  drawer.querySelector("#undo").onclick=async()=>{await Store.undo();renderDrawer();};
  const r=drawer.querySelector("#reset"); if(r) r.onclick=()=>{confirming=true;renderDrawer();};
  const n=drawer.querySelector("#no"); if(n) n.onclick=()=>{confirming=false;renderDrawer();};
  const y=drawer.querySelector("#yes"); if(y) y.onclick=async()=>{confirming=false;await Store.reset();renderDrawer();};
}
/* sheet is the store: no separate sync step */
const Sync={dirty:false}; function bindSync(){}
function closeDrawer(){drawer.hidden=true;confirming=false;editing=null;unlocked=false;pin="";pinErr=false;}
document.getElementById("staffBtn").onclick=()=>{drawer.hidden=false;renderDrawer();};
drawer.addEventListener("click",e=>{if(e.target===drawer) closeDrawer();});
document.getElementById("soundBtn").onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?"소리 켜짐":"소리 꺼짐";e.target.setAttribute("aria-pressed",soundOn);};

Store.listeners.push(()=>{ Sync.dirty=true; });

Store.listeners.push(()=>{ const m=document.getElementById("modeTag"); if(m) m.hidden=!Store.local; });
Store.listeners.push(()=>{ if(state.screen==="start") renderStart(); if(!drawer.hidden && !editing) renderDrawer(); });
render();
Store.init();
</script>

</body>
</html>
